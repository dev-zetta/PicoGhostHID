name: Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico1
            name: Pico 1
          - board: pico2
            name: Pico 2
          - board: rp2040zero
            name: Waveshare RP2040-Zero
          - board: hbb
            name: BIGTREETECH HBB

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build firmware with Docker
        run: ./scripts/build.sh --docker ${{ matrix.board }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicoGhostHID-${{ matrix.board }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.uf2
            dist/*.elf
            dist/*.txt
